[project]
name = "FlashGBX"
version = "5.0.1"
description = "Reads and writes Game Boy and Game Boy Advance cartridge data"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Lesserkuma" }
]

dependencies = [
    "pyserial>=3.5",
    "Pillow>=10.0",
    "requests",
    "python-dateutil",
    "packaging",
    "PySide6>=6.11.2",
    "loguru>=0.7.3",
]

# Classifiers **hier unter project**, nicht scripts**
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Terminals :: Serial",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers"
]

[project.urls]
Source = "https://github.com/Lesserkuma/FlashGBX/"
Tracker = "https://github.com/Lesserkuma/FlashGBX/issues"

[project.scripts]
flashgbx = "FlashGBX.FlashGBX:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["FlashGBX*"]

[tool.setuptools.package-data]
FlashGBX = ["res/**/*", "locale/**/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
    "pytest-cov>=7.1.0",
    "ty>=0.0.82",
    "pyrefly>=1.3.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "FlashGBX/hw_GameBub.py",
    "FlashGBX/hw_GBFlash.py",
    "FlashGBX/hw_JoeyJr.py",
]
source = ["FlashGBX"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.pyrefly]
project-includes = ["FlashGBX"]
# Keep the same application scope as the other type checkers and Ruff.
project-excludes = [
    "FlashGBX/hw_GameBub.py",
    "FlashGBX/hw_GBFlash.py",
    "FlashGBX/hw_JoeyJr.py",
]
python-version = "3.14"
python-platform = "all"

[tool.ty.environment]
# Check platform-specific APIs for all supported operating systems.
python-platform = "all"

[tool.ty.src]
include = ["FlashGBX"]
# Keep the same application scope as Pyright and Ruff.
exclude = [
    "FlashGBX/hw_GameBub.py",
    "FlashGBX/hw_GBFlash.py",
    "FlashGBX/hw_JoeyJr.py",
]

[tool.pyright]
include = ["FlashGBX"]
exclude = [
    "FlashGBX/hw_GameBub.py",
    "FlashGBX/hw_GBFlash.py",
    "FlashGBX/hw_JoeyJr.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
reportPrivateUsage=false
reportConstantRedefinition=false
reportUnnecessaryComparison=false
reportUnnecessaryIsInstance=false
reportUnknownVariableType=false
reportUnknownArgumentType=false
reportUnknownMemberType=false

reportUnknownLambdaType=false
reportMissingTypeArgument=false
reportUnknownParameterType=false
reportUnnecessaryCast=false
reportArgumentType=false
reportAttributeAccessIssue=false

[tool.ruff]
target-version = "py314"
line-length = 120
force-exclude = true
exclude = [
    "FlashGBX/hw_GameBub.py",
    "FlashGBX/hw_GBFlash.py",
    "FlashGBX/hw_JoeyJr.py",
]

[tool.ruff.lint]
# Add rule codes you want to ignore
select =["ALL"]
ignore = [
    "BLE001", # Do not catch blind exceoption
    "COM812", # Conflicts with the formatter
    "D203", # Conflicts with D211
    "D213", # Conflicts with D212
    "D102", #undocumented-public-method
    "N802", #invalid-function-name
    "PLR2004", #magic-value-comparison
    "T201", #print
    "E501", #line-too-long
    "N806", #on-lowercase-variable-in-function
    "ERA001", #commented-out-codes
    "FBT002", #boolean-default-value-positional-argument
    "D103", #undocumented-public-function
    "D101", #undocumented-public-class
    "FBT001", #boolean-type-hint-positional-argument
    "N803", #invalid-argument-name
    "D107", #undocumented-public-init
    "CPY001", #missing-copyright-notice
    "D100", #undocumented-public-module
    "S324", #hashlib-insecure-hash-function
    "N801", #invalid-class-name
]

[tool.ruff.lint.pylint]
max-branches = 24 # default is 12
max-statements = 100 # default is 50
max-returns = 9 # default is 6

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds setting, default is 10.
max-complexity = 22

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["PLR0913", "PLR0917", "SLF001", "ANN201", "FBT003", "S101"]
"InteractiveConsole.py" =["SLF001"]
