[project]
name = "FlashGBX"
version = "5.0.1"
description = "Reads and writes Game Boy and Game Boy Advance cartridge data"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Lesserkuma" }
]

dependencies = [
    "pyserial>=3.5",
    "Pillow>=10.0",
    "requests",
    "python-dateutil",
    "packaging",
    "pyside6>=6.11.2",
]

# Classifiers **hier unter project**, nicht scripts**
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Terminals :: Serial",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers"
]

[project.urls]
Source = "https://github.com/Lesserkuma/FlashGBX/"
Tracker = "https://github.com/Lesserkuma/FlashGBX/issues"

[project.scripts]
flashgbx = "FlashGBX.FlashGBX:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["FlashGBX*"]

[tool.setuptools.package-data]
FlashGBX = ["res/**/*", "locale/**/*"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]
