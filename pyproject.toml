[project]
name = "FlashGBX"
version = "5.0.1"
description = "Reads and writes Game Boy and Game Boy Advance cartridge data"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Lesserkuma" }
]

dependencies = [
    "pyserial>=3.5",
    "Pillow>=10.0",
    "requests",
    "python-dateutil",
    "packaging",
    "PySide6>=6.11.2",
    "loguru>=0.7.3",
]

# Classifiers **hier unter project**, nicht scripts**
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Terminals :: Serial",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers"
]

[project.urls]
Source = "https://github.com/Lesserkuma/FlashGBX/"
Tracker = "https://github.com/Lesserkuma/FlashGBX/issues"

[project.scripts]
flashgbx = "FlashGBX.FlashGBX:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["FlashGBX*"]

[tool.setuptools.package-data]
FlashGBX = ["res/**/*", "locale/**/*"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
    "FlashGBX.Mapper",
    "FlashGBX.RomFileDMG",
    "FlashGBX.hw_GBxCartRW",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true

[tool.pyright]
include = ["FlashGBX"]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py314"
line-length = 121

[tool.ruff.lint]
# Add rule codes you want to ignore
select =["ALL"]
ignore = [
    "BLE001", # Do not catch blind exceoption
    "D102", #undocumented-public-method
    "N802", #invalid-function-name
    "PLR2004", #magic-value-comparison
    "T201", #print
    "ANN001", #missing-type-function-argument
    "ANN201", #missing-return-type-undocumented-public-function
    "S101", #assert
    "E501", #line-too-long
    "RUF001", #ambiguous-unicode-character-string
    "N806", #on-lowercase-variable-in-function
    "ERA001", #commented-out-codes
    "FBT002", #boolean-default-value-positional-argument
    "D103", #undocumented-public-function
    "C901", #complex-structure
    "D101", #undocumented-public-class
    "PTH123", #builtin-open
    "SLF001", #private-member-access
    "PLR0915", #too-many-statements
    "PLR0912", #too-many-branches
    "FBT001", #boolean-type-hint-positional-argument
    "TRY003", #raise-vanilla-args
    "F405", #undefined-local-with-import-star-usage
]
