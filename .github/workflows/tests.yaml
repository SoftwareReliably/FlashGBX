name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Check types with ty
        run: uv run --locked ty check --output-format github

      - name: Run package coverage gate
        env:
          COVERAGE_FILE: coverage-package.data
        run: >-
          uv run --locked pytest
          --cov
          --cov-report=term-missing
          --cov-report=json:coverage-package.json
          --cov-report=xml:coverage-package.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.14
          if-no-files-found: warn
          path: |
            coverage-package.data
            coverage-package.json
            coverage-package.xml
